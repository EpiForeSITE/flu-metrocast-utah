
name: Process Utah Data

on:
  push:
    branches:
      - automation
    paths:
      - 'raw-data/*UT_Regional_Flu*.csv'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Check R installation
        run: Rscript -e 'print(R.version.string)'

      - name: List raw data files
        run: ls -l raw-data/
