
name: Process Utah Data

on:
  push:
    branches:
      - automation
    paths:
      - 'raw-data/*UT_Regional_Flu*.csv'
      - 'src/UT_clean.R'
      - '.github/workflows/process-utah-data.yaml'

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: utah-data-processing
  cancel-in-progress: false

jobs:
  process-data:
    if: github.repository == 'EpiForeSITE/flu-metrocast-utah'
    runs-on: ubuntu-latest

    steps:
      # Download the automation branch
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Install R
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Install and cache required R packages
      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::readr
            any::lubridate
            github::hubverse-org/hubValidations

      # Download latest target data from upstream hub
      - name: Fetch upstream target data
        run: |
          git remote add upstream https://github.com/reichlab/flu-metrocast.git
          git fetch upstream main

          echo "Upstream commit:"
          git rev-parse upstream/main

          echo "NC October 24 rows in upstream:"
          git show upstream/main:target-data/latest-data.csv |
            grep '^2026-10-24,"clt-area"' || true

          git restore --source=upstream/main --worktree -- target-data/

          # Preserve original upstream data for comparison
          cp target-data/latest-data.csv "$RUNNER_TEMP/latest-data-upstream.csv"
          cp target-data/time-series.csv "$RUNNER_TEMP/time-series-upstream.csv"


      # Identify the raw file used throughout the workflow
      - name: Identify Utah raw file
        run: |
          RAW_FILE=$(find raw-data -maxdepth 1 -type f \
            -name '[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]_UT_Regional_Flu_Only.csv' \
            | sort | tail -n 1)

          test -n "$RAW_FILE"

          FILE_DATE=$(basename "$RAW_FILE" | cut -c1-8)

          echo "RAW_FILE=$RAW_FILE" >> "$GITHUB_ENV"
          echo "FILE_DATE=$FILE_DATE" >> "$GITHUB_ENV"

          echo "Selected file: $RAW_FILE"
          echo "File date: $FILE_DATE"

      # Run your existing cleaning script
      - name: Process Utah data
        run: Rscript src/UT_clean.R

       - name: Diagnose other partners' data
         run: |
          Rscript -e '
            library(dplyr)
            library(readr)

            utah_locations <- c(
              "bear-river", "central", "davis", "san-juan",
              "salt-lake", "southeast", "southwest",
              "summit", "tooele", "tri-county",
              "utah-county", "wasatch", "weber-morgan", "utah"
            )

            original <- read_csv(
              file.path(Sys.getenv("RUNNER_TEMP"),
                        "latest-data-upstream.csv"),
              show_col_types = FALSE
            )

            updated <- read_csv(
              "target-data/latest-data.csv",
              show_col_types = FALSE
            )

            before <- original |>
              filter(!location %in% utah_locations)

            after <- updated |>
              filter(!location %in% utah_locations)

            cat("Original non-Utah rows:", nrow(before), "\n")
            cat("Updated non-Utah rows:", nrow(after), "\n")

            cat("\nRows missing from updated file:\n")
            print(
              anti_join(before, after, by = names(before)),
              n = 30
            )

            cat("\nRows added to updated file:\n")
            print(
              anti_join(after, before, by = names(before)),
              n = 30
            )

            if (!setequal(before, after)) {
              stop("Non-Utah observations differ from upstream.")
            }

            cat("Non-Utah observations preserved.\n")
          '

      # Check the newest Utah snapshot for duplicates
      - name: Check Utah duplicates
        run: |
          Rscript -e '

           library(dplyr)
            library(readr)

            as_of_date <- as.Date(
              Sys.getenv("FILE_DATE"),
              format = "%Y%m%d"
            )

            stopifnot(!is.na(as_of_date))

            df <- read_csv(
              "target-data/time-series.csv",
              show_col_types = FALSE,
              col_types = cols(as_of = col_date())
            )

            new_snapshot <- df |>
              filter(as_of == as_of_date)

            if (nrow(new_snapshot) == 0) {
              stop("No observations found for the new as_of date")
            }

            duplicates <- new_snapshot |>
              count(as_of, location, target, target_end_date) |>
              filter(n > 1)

            if (nrow(duplicates) > 0) {
              print(duplicates)
              stop("Duplicate observation keys found in new snapshot")
            }

            cat("New snapshot contains no duplicate keys.\n")
          '

      # Validate target data against Hubverse configuration
      - name: Validate target data
        continue-on-error: true
        run: |
          Rscript -e '

            hubValidations::validate_target_submission(
              hub_path = ".",
              file_path = "time-series.csv",
              target_type = "time-series",
              allow_extra_dates = TRUE
            ) |>
              hubValidations::check_for_errors()

            hubValidations::validate_target_submission(
              hub_path = ".",
              file_path = "oracle-output.csv",
              target_type = "oracle-output"
            ) |>
              hubValidations::check_for_errors()
          '

      # Show which files were changed
      - name: Review changed files
        run: |
          echo "Current directory:"
          pwd

          echo "Target data files:"
          ls -lh target-data/

          echo "Git status:"
          git status --short

          echo "Git diff:"
          git diff --stat

          echo "Latest file modification times:"
          stat target-data/latest-data.csv
          stat target-data/time-series.csv
          stat target-data/oracle-output.csv

          echo "Changes relative to upstream:"
          git diff --stat upstream/main -- target-data/
          git diff --name-only upstream/main -- target-data/

          echo "Changes relative to automation branch:"
          git status --short

      # Prepare a clean submission branch from upstream
      - name: Prepare Utah submission branch
        run: |
          # Save processed Utah data outside the repository
          mkdir -p "$RUNNER_TEMP/utah-output"
          cp target-data/*.csv "$RUNNER_TEMP/utah-output/"

          # Save the selected Utah raw file
          cp "$RAW_FILE" "$RUNNER_TEMP/utah-output/"

          # Reset temporary working files
          git reset --hard
          git clean -fd

          # Create a clean branch from upstream main
          git switch -C utah-submission-test upstream/main

          # Restore processed target data
          cp "$RUNNER_TEMP/utah-output/latest-data.csv" target-data/
          cp "$RUNNER_TEMP/utah-output/time-series.csv" target-data/
          cp "$RUNNER_TEMP/utah-output/oracle-output.csv" target-data/

          # Restore the selected Utah raw file
          mkdir -p raw-data
          cp "$RUNNER_TEMP/utah-output/$(basename "$RAW_FILE")" raw-data/

          # Stage only the intended submission files
          git add target-data/latest-data.csv
          git add target-data/time-series.csv
          git add target-data/oracle-output.csv
          git add "raw-data/$(basename "$RAW_FILE")"

          # Display the staged changes
          echo "Files staged for submission:"
          git diff --cached --name-only

          echo "Submission summary:"
          git diff --cached --stat

          echo "Current branch:"
          git branch --show-current

      # Check whether there are any changes to submit
      - name: Check for data changes
        id: changes
        run: |
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Data changes detected."
          fi

      # Commit and push the processed data to our fork
      - name: Push Utah submission branch
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.METROCAST_PR_TOKEN }}
        run: |
          # Identify GitHub Actions as the author
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Create a commit if files have changed
          if git diff --cached --quiet; then
            echo "No new data changes to commit."
            exit 0
          fi

          git commit -m "Update Utah influenza surveillance data"

          # Use the date identified before switching branches
          BRANCH="utah-submission-${FILE_DATE}"

          # Set up authentication using the classic PAT
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"

          # Check whether the submission branch already exists
          if git -c http.extraheader="$AUTH_HEADER" \
            ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then

            echo "Existing submission branch found. Updating it."

            # Fetch the existing branch
            git -c http.extraheader="$AUTH_HEADER" fetch origin \
              "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"

          else
            echo "Creating new submission branch."
          fi

          # Push the latest processed data
          git -c http.extraheader="$AUTH_HEADER" \
            push --force-with-lease origin "HEAD:refs/heads/$BRANCH"

          echo "Submission branch created: $BRANCH"

      # Open a pull request to the upstream MetroCast hub
      # Create PR only if one does not already exist
      - name: Create upstream pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.METROCAST_PR_TOKEN }}
        run: |
          BRANCH="utah-submission-${FILE_DATE}"

          # Check for an existing PR using GitHub's API
          EXISTING_PR=$(gh api \
            "repos/reichlab/flu-metrocast/pulls?state=all&head=EpiForeSITE:$BRANCH&base=main" \
            --jq '.[0].number // empty')

          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists."
            echo "Submission branch updated successfully."
            exit 0
          fi

          # Create a new PR only if none exists
          gh api \
            --method POST \
            repos/reichlab/flu-metrocast/pulls \
            -f title="Update Utah ED visit data - $FILE_DATE" \
            -f head="EpiForeSITE:$BRANCH" \
            -f base="main" \
            -f body="Automated Utah influenza ED visit data update."

      # Slack notification when workflow succeeds
      - name: Slack success notification
        if: ${{ success() }}
        uses: slackapi/slack-github-action@v2.1
        with:
          webhook: ${{ secrets.UT_METROCAST_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":white_check_mark: *Utah MetroCast data update succeeded.*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View GitHub Actions run>"
            }
